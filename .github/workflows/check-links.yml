name: Check links

on:
  schedule:
    - cron: "41 13 * * 1" # Mondays, 13:41 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - ".lycheeignore"
      - ".github/workflows/check-links.yml"

permissions:
  contents: read
  actions: write # Re-enable this workflow's schedule (inactivity keepalive)

concurrency:
  group: check-links-${{ github.event_name }}
  cancel-in-progress: true

# Both checks accept 429 Too Many Requests as well as lychee's defaults.
# GitHub throttles automated requests for file pages (blob URLs) even
# with a token, and a 429 means the server is there and asking us to slow
# down, not that the page is gone: a missing page still returns 404.
# lychee 0.24 can't set accepted codes per host, so this applies to all.
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a pull request, check external links only. A site-relative link
      # (/projects/...) may point at a page the same pull request adds, which
      # isn't live yet, so those are checked after deploy by the scheduled run.
      - name: Check external links in proposed content
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '100..=103,200..=299,429'
            --base-url https://jacksonasmith.com/
            --exclude '^https://jacksonasmith\.com'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids github.com rate limits

      # Otherwise check every link, resolving site-relative links against the
      # live site, so a page that moved or was renamed shows up here.
      - name: Check all links against the live site
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '100..=103,200..=299,429'
            --base-url https://jacksonasmith.com/
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Keep scheduled workflow enabled
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub disables cron schedules after 60 days without repository
          # activity, and scheduled runs don't count as activity.
          # Re-enabling on every run resets that timer.
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-links.yml/enable"
