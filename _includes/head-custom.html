{% feed_meta %}
<style>
  /* Colors: github-markdown-css (assets/css/github-markdown.css) defines light
     and dark values for its --fgColor-* / --borderColor-* / --bgColor-*
     variables on .markdown-body, switching on prefers-color-scheme. Everything
     on the page sits inside .markdown-body, so custom styles use those
     variables instead of hard-coded colors. Only <body> is outside it. */
  :root { color-scheme: light dark; }
  /* Page layout. These replace the only parts of the Primer theme stylesheet the
     site used (box-sizing, .container-lg, .px-3, .my-5), so the theme's ~77 KB
     stylesheet no longer has to load before the page can render. Values match
     the theme's. github-markdown-css sets margin: 0 on .markdown-body, so the
     selector includes it to win. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  .container-lg.markdown-body { max-width: 1012px; margin: 32px auto; padding: 0 16px; }
  body { background-color: #ffffff; }
  @media (prefers-color-scheme: dark) {
    body { background-color: #0d1117; color: #f0f6fc; } /* = --bgColor-default / --fgColor-default */
  }

  .site-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem; border-bottom: 1px solid var(--borderColor-muted); margin-bottom: 2rem; padding-bottom: .75rem; }
  .site-header .site-title { font-size: 1.25rem; font-weight: 600; color: inherit; }
  .markdown-body .site-nav { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin: 0; padding: 0; list-style: none; }
  .markdown-body .site-nav li + li { margin-top: 0; }
  .site-nav a[aria-current="page"] { font-weight: 600; text-decoration: underline; }
  .markdown-body .impact { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
  .markdown-body .impact li + li { margin-top: 0; }
  .impact li { border: 1px solid var(--borderColor-muted); border-radius: 6px; padding: .75rem 1rem; }
  .impact strong { display: block; font-size: 1.5rem; line-height: 1.2; }
  .impact span { font-size: .875rem; color: var(--fgColor-muted); }
  .avatar-hero { float: right; width: 120px; margin: 0 0 1rem 1.5rem; border-radius: 50%; }
  .tags { font-size: .875rem; color: var(--fgColor-muted); }
  .markdown-body .series { border-left: 4px solid var(--fgColor-accent); padding: .5rem 1rem; margin: 1.5rem 0; }
  .markdown-body .series p, .markdown-body .series ul { margin-bottom: 0; }
  .site-footer { border-top: 1px solid var(--borderColor-muted); margin-top: 3rem; padding-top: 1rem; font-size: .875rem; color: var(--fgColor-muted); }
  .markdown-body pre.mermaid { background: none; padding: 0; text-align: center; overflow-x: auto; }
  .markdown-body pre.mermaid svg { max-width: 100%; max-height: 34rem; height: auto; }
  @media (max-width: 544px) { .avatar-hero { float: none; display: block; margin: 0 0 1rem; } }

  /* Code highlighting: Rouge emits Pygments-style token classes. Map token
     groups to GitHub's syntax variables so code follows the color scheme. */
  .markdown-body .highlight :is(.c, .ch, .cd, .cm, .cp, .cpf, .c1, .cs) { color: var(--color-prettylights-syntax-comment); }
  .markdown-body .highlight :is(.k, .kd, .kn, .kp, .kr, .kt, .kv, .ow) { color: var(--color-prettylights-syntax-keyword); }
  .markdown-body .highlight :is(.s, .sa, .sb, .sc, .dl, .sd, .s2, .se, .sh, .si, .sx, .s1, .ss) { color: var(--color-prettylights-syntax-string); }
  .markdown-body .highlight .sr { color: var(--color-prettylights-syntax-string-regexp); }
  .markdown-body .highlight :is(.m, .mb, .mf, .mh, .mi, .il, .mo, .mx, .kc, .no, .nb, .bp, .na) { color: var(--color-prettylights-syntax-constant); }
  .markdown-body .highlight :is(.nf, .fm, .nc, .ne, .nd, .nn) { color: var(--color-prettylights-syntax-entity); }
  .markdown-body .highlight .nt { color: var(--color-prettylights-syntax-entity-tag); }
  .markdown-body .highlight :is(.nv, .vc, .vg, .vi, .vm) { color: var(--color-prettylights-syntax-variable); }
  .markdown-body .highlight :is(.gh, .gu) { color: var(--color-prettylights-syntax-markup-heading); font-weight: 600; }
  .markdown-body .highlight .gi { color: var(--color-prettylights-syntax-markup-inserted-text); background-color: var(--color-prettylights-syntax-markup-inserted-bg); }
  .markdown-body .highlight .gd { color: var(--color-prettylights-syntax-markup-deleted-text); background-color: var(--color-prettylights-syntax-markup-deleted-bg); }
  .markdown-body .highlight .ge { font-style: italic; }
  .markdown-body .highlight .gs { font-weight: 600; }
  .markdown-body .highlight .err { color: var(--color-prettylights-syntax-invalid-illegal-text); background-color: var(--color-prettylights-syntax-invalid-illegal-bg); }

  /* Résumé printing (Experience page, front matter print_resume: true).
     On screen: hide the print-only contact header. On paper: hide navigation,
     the footer, and anything marked .no-print, and tighten the type so the
     page reads as a résumé. */
  .print-only { display: none; }
  .print-button { font: inherit; font-size: .875rem; padding: .2rem .65rem; margin: 0 .25rem; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-muted); color: var(--fgColor-default); cursor: pointer; }
  .print-button:hover { border-color: var(--fgColor-accent); }
  @media print {
    @page { margin: .6in .65in; }
    /* Paper is white even if the reader's system is in dark mode. */
    :root, body { color-scheme: light; background: #fff !important; }
    .markdown-body, .markdown-body * { color: #1f2328 !important; background: transparent !important; }
    .no-print, .site-header, .site-footer { display: none !important; }
    .print-only { display: block; }
    .container-lg.markdown-body { max-width: none; margin: 0; padding: 0; font-size: 10pt; line-height: 1.4; }
    .resume-page main > h1 { display: none; }
    .resume-header { margin-bottom: 1rem; }
    .resume-header p { margin: 0; }
    .resume-header span { white-space: nowrap; }
    .markdown-body .resume-name { font-size: 20pt; font-weight: 600; line-height: 1.2; }
    .markdown-body h2 { font-size: 12.5pt; margin: 1rem 0 .4rem; padding-bottom: .15rem; border-bottom-color: #d1d9e0; }
    .markdown-body h3 { font-size: 10.5pt; margin: .75rem 0 .25rem; }
    .markdown-body h4 { font-size: 10pt; margin: .5rem 0 .15rem; }
    .markdown-body p, .markdown-body ul { margin-bottom: .4rem; }
    .markdown-body li + li { margin-top: .1rem; }
    .markdown-body a { text-decoration: none; }
    .markdown-body h2, .markdown-body h3, .markdown-body h4 { break-after: avoid; }
    .markdown-body li { break-inside: avoid; }
    /* Earlier roles print as a compact list of titles and dates. */
    .markdown-body .early-roles h3 { font-weight: 400; margin: .15rem 0; }
    /* The résumé itself prints denser than other pages, to fit two pages. */
    @page resume { margin: .45in .5in; }
    .resume-page { page: resume; }
    .resume-page .container-lg.markdown-body { font-size: 9.5pt; line-height: 1.3; }
    .resume-page .markdown-body .resume-name { font-size: 16pt; }
    .resume-page .resume-header { margin-bottom: .4rem; }
    .resume-page .markdown-body h2 { font-size: 10.5pt; margin: .55rem 0 .2rem; padding-bottom: .05rem; }
    .resume-page .markdown-body h3 { font-size: 9.5pt; margin: .4rem 0 .1rem; }
    .resume-page .markdown-body h4 { font-size: 9pt; font-style: italic; margin: .2rem 0 .05rem; }
    .resume-page .markdown-body :is(p, ul) { margin-bottom: .2rem; }
    .resume-page .markdown-body ul { padding-left: 1.4em; }
    .resume-page .markdown-body li + li { margin-top: 0; }
    .resume-page .markdown-body .early-roles h3 { margin: 0; break-after: auto; }
    .resume-page .markdown-body table { display: block; margin: 0; }
    .resume-page .markdown-body :is(tr, td, th) { border: 0; padding: 0 .5em 0 0; }
  }
</style>
{% if page.mermaid %}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  // kramdown renders ```mermaid fences as highlighted code; swap them for
  // the <pre class="mermaid"> elements Mermaid looks for.
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
    const block = el.matches("code") ? el.parentElement : el;
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = el.textContent;
    block.replaceWith(pre);
  });
  // Match the diagram theme to the visitor's color scheme at load time.
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  await mermaid.run();
  // Mermaid scales each diagram down to fit its column. On a phone that shrinks
  // a wide flowchart's 16px labels to 5-8px. Never scale below 70% (11px text);
  // past that, the diagram keeps its size and scrolls sideways in its own box,
  // the way wide tables already do.
  const MIN_SCALE = 0.7;
  const fitDiagrams = () => {
    document.querySelectorAll("pre.mermaid svg").forEach((svg) => {
      // Mermaid sets its own inline max-width (the diagram's natural width);
      // keep it so wide screens render exactly as before.
      svg.dataset.mermaidMaxWidth ??= svg.style.maxWidth;
      const minWidth = svg.viewBox.baseVal.width * MIN_SCALE;
      const tooSmall = minWidth > svg.parentElement.clientWidth;
      svg.style.width = tooSmall ? `${minWidth}px` : "";
      svg.style.maxWidth = tooSmall ? "none" : svg.dataset.mermaidMaxWidth;
      svg.style.maxHeight = tooSmall ? "none" : "";
      if (!tooSmall) return;
      // Start the scroll on the top-most node (where a top-down flowchart
      // begins) so the reader doesn't land on an empty corner.
      const nodes = [...svg.querySelectorAll("g.node")];
      if (!nodes.length) return;
      const start = nodes.reduce((a, n) => (n.getBoundingClientRect().top < a.getBoundingClientRect().top ? n : a));
      const box = svg.parentElement, s = start.getBoundingClientRect(), b = box.getBoundingClientRect();
      box.scrollLeft += s.left + s.width / 2 - (b.left + b.width / 2);
    });
  };
  fitDiagrams();
  window.addEventListener("resize", fitDiagrams);
</script>
{% endif %}
