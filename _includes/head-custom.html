{% if site.google_analytics_id and jekyll.environment == "production" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics_id }}');
</script>
{% endif %}
{% feed_meta %}
<style>
  .site-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .5rem 1.5rem; border-bottom: 1px solid #eaecef; margin-bottom: 2rem; padding-bottom: .75rem; }
  .site-header .site-title { font-size: 1.25rem; font-weight: 600; color: inherit; }
  .markdown-body .site-nav { display: flex; flex-wrap: wrap; gap: .25rem 1rem; margin: 0; padding: 0; list-style: none; }
  .markdown-body .site-nav li + li { margin-top: 0; }
  .site-nav a[aria-current="page"] { font-weight: 600; text-decoration: underline; }
  .markdown-body .impact { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
  .markdown-body .impact li + li { margin-top: 0; }
  .impact li { border: 1px solid #eaecef; border-radius: 6px; padding: .75rem 1rem; }
  .impact strong { display: block; font-size: 1.5rem; line-height: 1.2; }
  .impact span { font-size: .875rem; color: #586069; }
  .avatar-hero { float: right; width: 120px; margin: 0 0 1rem 1.5rem; border-radius: 50%; }
  .tags { font-size: .875rem; color: #586069; }
  .site-footer { border-top: 1px solid #eaecef; margin-top: 3rem; padding-top: 1rem; font-size: .875rem; color: #586069; }
  @media (max-width: 544px) { .avatar-hero { float: none; display: block; margin: 0 0 1rem; } }
</style>
{% if page.mermaid %}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  // kramdown renders ```mermaid fences as highlighted code; swap them for
  // the <pre class="mermaid"> elements Mermaid looks for.
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
    const block = el.matches("code") ? el.parentElement : el;
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = el.textContent;
    block.replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
{% endif %}
