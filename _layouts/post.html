---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="tags"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.principles %} · {{ page.principles | join: " · " }}{% endif %}</p>
  {{ content }}
  <p><a href="{{ "/writing/" | relative_url }}">← All writing</a></p>
</article>
