---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p><em>{{ page.summary }}</em></p>{% endif %}
  {% if page.principles %}<p class="tags">Principles: {{ page.principles | join: " · " }}</p>{% endif %}
  {% if page.repo %}<p>Code: <a href="{{ page.repo }}">{{ page.repo | remove: "https://" }}</a></p>{% endif %}
  {{ content }}
  <p><a href="{{ "/projects/" | relative_url }}">← All projects</a></p>
</article>
